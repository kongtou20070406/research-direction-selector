name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pymupdf
      - name: Links and local-path privacy
        run: python scripts/check_routes.py --repo-only
      - name: Gate, router and manuscript-check fixtures
        run: python -m pytest -q tests skills/paper-write/tests
