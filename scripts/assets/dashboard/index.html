const routes=[['overview','◫'],['hypotheses','◇'],['plans','▤'],['receipts','▧'],['branches','⑂'],['advisor','◎'],['history','↶'],['start','↗']];
function preference(key,fallback){try{return localStorage.getItem(key)||fallback}catch{return fallback}}
function savePreference(key,value){try{localStorage.setItem(key,value)}catch{}}
let language=preference('rds-dashboard-language','zh');if(!dict[language])language='zh';
let route='overview';const theme=preference('rds-dashboard-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme==='dark'?'dark':'light';
const t=key=>dict[language][key]||key;
const show=value=>value===undefined||value===null||value===''?'—':typeof value==='object'?JSON.stringify(value):String(value);
function node(tag,content,className){const n=document.createElement(tag);if(className)n.className=className;if(content!==undefined)n.textContent=show(content);return n}
function pill(value){const status=show(value),n=node('span',status,'pill');if(['CONFIRMED','SUPPORTED','SUCCEEDED','ACTIVE'].includes(status))n.classList.add('good');if(['REFUTED','FAILED','TIMED_OUT','RECOVERY_REQUIRED','NEEDS_REVIEW'].includes(status))n.classList.add('warn');return n}
function fields(pairs){const dl=node('dl',undefined,'fields');for(const [key,value] of pairs){dl.append(node('dt',t(key)),node('dd',show(value)))}return dl}
function raw(parent,value,label='raw'){const detail=node('details');detail.append(node('summary',t(label)),node('pre',JSON.stringify(value,null,2)));parent.append(detail)}
function card(title,status){const n=node('article',undefined,'card'),head=node('div',undefined,'card-top');head.append(node('h3',title));if(status!==undefined)head.append(pill(status));n.append(head);return n}
function empty(title,copy){const n=node('div',undefined,'empty');n.append(node('div','◇','empty-icon'),node('h3',t(title)),node('p',t(copy)));return n}
function axes(value){const n=node('div',undefined,'axes');for(const key of ['task_gain','mechanism','search_policy']){const a=node('div',undefined,'axis');a.append(node('span',t(key)),node('strong',value?.[key]??t('missing')));n.append(a)}return n}
function recordList(items,title,copy,builder){const q=document.getElementById('search').value.toLocaleLowerCase(),matches=items.filter(item=>JSON.stringify(item).toLocaleLowerCase().includes(q)),grid=node('div',undefined,'grid records');if(!matches.length){grid.append(empty(items.length?'noMatches':title,items.length?'noMatchesCopy':copy));return grid}matches.forEach(item=>grid.append(builder(item)));return grid}
function recordEntries(value){return Object.entries(value||{}).map(([id,value])=>({id,...value}))}
function planEntries(){return projectLedger?state.runs||[]:recordEntries(state.plans)}
function resourceUnknown(entry){return !entry||entry.unknown===true||typeof entry.measured!=='number'}
function budgetEntries(){if(projectLedger)return Object.entries(state.budget||{}).map(([resource,b])=>({resource,cap:b.cap,spent:b.spent_measured,charged:b.charged_estimate,reserved:b.reserved,remaining:b.remaining,unit:b.unit}));const b=state.budget;if(!b?.limits)return [];return Object.entries(b.limits).map(([resource,cap])=>({resource,cap,spent:b.spent?.[resource],reserved:b.reserved?.[resource],remaining:typeof cap==='number'&&typeof b.spent?.[resource]==='number'&&typeof b.reserved?.[resource]==='number'?cap-b.spent[resource]-b.reserved[resource]:undefined,floor:b.confirmation_floor?.[resource]}))}
function overview(){const wrap=node('div'),stats=node('div',undefined,'stats');for(const [key,count] of [['hypothesisCount',Object.keys(state.hypotheses||{}).length],[projectLedger?'runCount':'planCount',planEntries().length],['receiptCount',data.receipts.length],['branchCount',Object.keys(state.branches||{}).length]]){const n=node('div',undefined,'stat');n.append(node('strong',data.available?count:'—'),node('span',t(key)));stats.append(n)}wrap.append(stats);const grid=node('div',undefined,'grid');const contract=state.contract;if(contract&&Object.keys(contract).length){const goal=card(t('contract'));goal.classList.add('wide');const rows=[['ledgerType',data.ledger_type],['next_decision',contract.next_decision??contract.decision],['metric',contract.primary_metric?.name],['direction',contract.primary_metric?.direction],['threshold',contract.primary_metric?.min_useful_delta],['scope',contract.evaluation_scope]];for(const key of ['baseline','protected','selection','evidence_refs'])if(contract[key]!==undefined)rows.push([key,contract[key]]);rows.push(['contractHash',state.contract_sha256]);goal.append(node('p',contract.claim??contract.description,'claim'),fields(rows));raw(goal,contract);grid.append(goal)}else grid.append(empty('noContract','noContractCopy'));
const budgets=budgetEntries();if(budgets.length){for(const b of budgets){const n=card(t('budget')+' · '+b.resource),amounts=node('div',undefined,'budget-values'),values=[[projectLedger?'spentMeasured':'spent',b.spent],['reserved',b.reserved],['available',b.remaining]];if(projectLedger)values.splice(1,0,['chargedEstimate',b.charged]);for(const [label,amount] of values){const v=node('div');v.append(node('strong',amount),node('span',t(label)));amounts.append(v)}n.append(amounts);const used=projectLedger?typeof b.spent==='number'&&typeof b.charged==='number'&&typeof b.reserved==='number'?b.spent+b.charged+b.reserved:undefined:typeof b.spent==='number'&&typeof b.reserved==='number'?b.spent+b.reserved:undefined;if(typeof b.cap==='number'&&b.cap>0&&typeof used==='number'){const meter=node('meter');meter.min=0;meter.max=b.cap;meter.value=used;meter.setAttribute('aria-label',t('budget')+' / '+t('limit')+' ('+b.resource+')');n.append(meter)}if(projectLedger){const unknown=data.receipts.filter(r=>resourceUnknown(r.resources?.[b.resource])).length;if(unknown)n.append(node('p',t('unmeasuredRuns')+': '+unknown,'subtle'))}n.append(fields([['limit',b.cap],['unit',b.unit],['floor',b.floor]]));grid.append(n)}}else grid.append(empty('noBudget','noBudgetCopy'));
const active=state.branches?.[state.active_branch];if(active){const n=card(t('activeBranch')+' · '+state.active_branch,active.status);n.classList.add('wide');n.append(fields([['dimension',active.orthogonal_dimension],['rationale',active.rationale],['stagnation',active.stagnation_count]]));grid.append(n)}wrap.append(grid,node('div',t('axesNote'),'notice'));return wrap}
function hypotheses(){return recordList(recordEntries(state.hypotheses),'noHypotheses','noHypothesesCopy',h=>{const n=card(h.id,h.spec?.type);n.append(node('p',h.spec?.proposition),axes(h),fields([['falsifier',h.spec?.falsifier]]));raw(n,h);return n})}
function plans(){return recordList(planEntries(),'noPlans','noPlansCopy',p=>{const n=card(p.id,p.run_status),spec=projectLedger?p.manifest||{}:p.spec||{};n.append(fields(projectLedger?[['run',p.run_id],['arm',spec.arm],['argv',spec.argv],['protocol',p.protocol],['resources',p.resource_estimates]]:[['hypothesis',spec.hypothesis_id],['purposeLabel',spec.purpose],['split',spec.split_id],['resources',spec.resources],['run',p.run_id]]));if(p.assessment)n.append(axes(p.assessment));raw(n,p);return n})}
function receipts(){return recordList(data.receipts,'noReceipts','noReceiptsCopy',r=>{const n=card(r.plan_id||r.run_id,r.run_status),plan=planEntries().find(p=>p.run_id===r.run_id),source=data.receipt_sources?.[r.run_id];const rows=[['run',r.run_id]];
if(projectLedger){const wall=r.resources?.wall_seconds;rows.push(['elapsedSeconds',resourceUnknown(wall)?t('unknown'):wall.measured],['process_status',r.process_status])}else rows.push(['observedGain',r.result?.gain],['elapsed',r.elapsed_ms],['charged',r.charged_allocation],['controlReused',r.control_reused===undefined?undefined:t(r.control_reused?'yes':'no')]);
rows.push(['receiptHash',r.sha256],['receiptSource',source],[Array.isArray(r.artifacts)&&r.artifacts.every(a=>typeof a?.path==='string')?'artifacts':'artifactIdentities',r.artifacts]);n.append(fields(rows));
if(projectLedger)for(const [name,entry] of Object.entries(r.resources||{})){n.append(node('h4',t('resourceMeasurements')+' · '+name));const values=[['measured',resourceUnknown(entry)?t('unknown'):entry.measured],['unit',entry?.unit],['chargedEstimate',entry?.charged_estimate]];if(entry?.observed_lower_bound!==undefined)values.push(['observedLowerBound',entry.observed_lower_bound]);n.append(fields(values))}
const assessment=r.assessment||plan?.assessment;if(assessment)n.append(axes(assessment));raw(n,r);return n})}
function branches(){return recordList(recordEntries(state.branches),'noBranches','noBranchesCopy',b=>{const n=card(b.id,b.id===state.active_branch?t('active'):b.status);n.append(fields([['parent',b.parent_id],['dimension',b.orthogonal_dimension],['rationale',b.rationale],['stagnation',b.stagnation_count],['branchHypotheses',b.hypotheses]]));raw(n,b);return n})}
function adviceSection(parent,key,value){if(value===undefined)return;const section=node('section',undefined,'advice-field');section.append(node('h4',t(key)));if(Array.isArray(value)){const list=node('ul',undefined,'list');for(const item of value){const li=node('li');li.append(item&&typeof item==='object'?fields(Object.entries(item)):node('span',item));list.append(li)}section.append(list)}else if(value&&typeof value==='object')section.append(fields(Object.entries(value)));else section.append(node('p',show(value),'subtle'));parent.append(section)}
function candidateCard(c){const n=card(c.id||c.action_id||c.rule_id,c.status);if(c.action?.description)n.append(node('p',c.action.description));if(c.reason)n.append(node('p',c.reason,'subtle'));for(const key of ['execution_authorized','budget_status','competing_explanations','rival_explanations','required_observables','interventions','control_bindings','observables','facts','outcomes','result_to_decision','incremental_cost','stop_conditions'])adviceSection(n,key,c[key]);
const pending=(c.steps||[]).filter(s=>s.kind==='READ_ONLY_EVIDENCE_REQUEST');if(pending.length)adviceSection(n,'neededEvidence',pending);if(c.steps)adviceSection(n,'steps',c.steps);if(c.derivation)adviceSection(n,'derivation',c.derivation.map(d=>Object.fromEntries(Object.entries(d).filter(([key])=>key!=='trace'))));raw(n,c);return n}
function advisor(){const wrap=node('div');wrap.append(node('div',t('advisorNote'),'notice'));const imported=data.advisor===null?[]:Array.isArray(data.advisor)?data.advisor:[data.advisor],items=imported.flatMap(a=>Array.isArray(a?.recommendations)?[a,...a.recommendations]:[a]);wrap.append(recordList(items,'noAdvisor','noAdvisorCopy',a=>{const n=card(typeof a==='object'&&a?(a.diagnosis||a.verdict||a.detected_bottleneck||a.type||a.advisor_type||t('advisor')):t('advisor'),a?.status);
for(const [key,value] of Object.entries(a&&typeof a==='object'?a:{value:a})){if(['diagnosis','verdict','detected_bottleneck','advisor_type','type','status'].includes(key)||key==='recommendations'&&Array.isArray(value)||key==='search'&&Array.isArray(value?.candidates)||Array.isArray(a?.search?.candidates)&&['observations','minimal_test'].includes(key))continue;const section=node('section',undefined,'advice-field');section.append(node('h4',t(key)));if(typeof value==='object')section.append(node('pre',JSON.stringify(value,null,2)));else section.append(node('p',show(value),'subtle'));n.append(section)}
if(Array.isArray(a?.search?.candidates)){n.classList.add('wide');adviceSection(n,'decision',a.search.decision);adviceSection(n,'queries',a.search.queries);for(const [key,candidates] of [['candidates',a.search.candidates],['blocked_candidates',a.search.blocked_candidates],['experimentCandidates',a.search.experiment_composition?.candidates]]){if(!Array.isArray(candidates)||!candidates.length)continue;n.append(node('h4',t(key)));const grid=node('div',undefined,'grid');for(const c of candidates)grid.append(candidateCard(c));n.append(grid)}adviceSection(n,'limitations',a.search.limitations)}raw(n,a);return n}));return wrap}
function history(){const wrap=node('div');wrap.append(node('p',t('recentEvents')+' · '+data.events.length+' / '+t('eventCount')+' '+data.event_count,'subtle'));wrap.append(recordList(data.events,'noEvents','noEventsCopy',e=>{const n=card(e.kind);if(e.time_ns)n.append(node('time',new Date(e.time_ns/1e6).toLocaleString(language==='zh'?'zh-CN':'en-GB')));raw(n,e);return n}));return wrap}
function start(){const wrap=node('div'),grid=node('div',undefined,'grid');for(let i=1;i<=5;i++){const n=card('');n.classList.add('start-step');n.replaceChildren(node('span',i,'step-number'));const text=node('div');text.append(node('h3',t('guide'+i)),node('p',t('guide'+i+'Copy')));n.append(text);grid.append(n)}const cmds=card(t('quickCommands'));cmds.classList.add('wide');cmds.append(node('p',t('commandsNote'),'subtle'),node('pre','python -B scripts/rds_cli.py --root <project> init --contract contract.json\npython -B scripts/rds_cli.py --root <project> hypothesis add --spec hypothesis.json\npython -B scripts/rds_cli.py --root <project> plan create --spec plan.json\npython -B scripts/rds_cli.py --root <project> run execute --id <plan-id>\npython -B scripts/rds_cli.py --root <project> decide --run <run-id>\npython -B scripts/rds_dashboard.py --root <project> --output dashboard.html'));grid.append(cmds);wrap.append(grid,node('div',undefined,'divider'),node('h2',t('capabilities')));const caps=node('div',undefined,'capabilities');for(const key of ['researchCapability','executionCapability','mathCapability']){const c=card(t(key));c.append(node('p',t(key+'Copy'),'subtle'));caps.append(c)}wrap.append(caps);return wrap}

function render(){document.documentElement.lang=language==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(n=>n.placeholder=t(n.dataset.placeholder));document.getElementById('language').value=language;document.getElementById('theme').textContent='◐ '+t('theme');document.getElementById('project').textContent=state.contract?.project_id||t('defaultProject');document.title=(state.contract?.project_id||'RDS')+' · '+t('researchWorkspace');document.getElementById('timestamp').textContent=new Date(data.generated_at).toLocaleString(language==='zh'?'zh-CN':'en-GB');document.getElementById('source').textContent=data.database||t('demoNotice');const notice=document.getElementById('notice');notice.textContent=t(data.demo?'demoNotice':data.available?'liveNotice':'noDataNotice');notice.classList.toggle('demo-notice',data.demo);const nav=document.getElementById('nav');nav.replaceChildren();routes.forEach(([key,icon])=>{const b=node('button');b.type='button';b.id='tab-'+key;b.setAttribute('role','tab');b.setAttribute('aria-selected',String(key===route));b.setAttribute('aria-controls','view');b.tabIndex=key===route?0:-1;b.append(node('span',icon,'nav-icon'),node('span',t(key)));b.addEventListener('click',()=>navigate(key));b.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let index=routes.findIndex(r=>r[0]===key);index=e.key==='Home'?0:e.key==='End'?routes.length-1:(index+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)+routes.length)%routes.length;navigate(routes[index][0]);document.getElementById('tab-'+routes[index][0]).focus()}});nav.append(b)});const flow=document.getElementById('workflow');flow.replaceChildren();[['goal','overview'],['investigate','hypotheses'],['choose','plans'],['execute','receipts'],['reflect','history']].forEach(([label,key],i)=>{const b=node('button');b.type='butto
