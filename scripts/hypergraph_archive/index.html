<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; style-src 'unsafe-inline'; worker-src blob:; img-src data: blob:; connect-src 'none'; font-src data:"><title>RDS · 关系图谱</title><style>@@STYLE@@</style></head>
<body class="theme-dark">
<header class="view-header">
  <span id="source-name" title="本地档案 · 只读">本地档案 · 只读</span><h1>关系图谱</h1>
  <nav class="header-actions" aria-label="图谱操作">
    <button class="icon-btn" id="fit" type="button" aria-label="适应全图" title="适应全图">⊡</button>
    <button class="icon-btn" id="restart" type="button" aria-label="重置视图" title="重置视图">↻</button>
    <button class="icon-btn" id="grow" type="button" aria-label="缓慢显示当前视图" title="缓慢显示当前视图">▷</button>
    <button class="icon-btn" id="pause" type="button" aria-label="暂停布局" aria-pressed="false" title="暂停布局">Ⅱ</button>
    <button class="icon-btn" id="theme" type="button" aria-label="切换主题" title="切换主题">◐</button>
    <button class="icon-btn" id="settings" type="button" aria-label="图谱设置" aria-controls="tools" aria-expanded="false" title="图谱设置">⚙</button>
  </nav>
</header>
<main id="graph" aria-label="关系图谱画布"></main>
<button class="icon-btn graph-controls-gear" id="gear" type="button" aria-label="展开图谱设置与搜索" aria-controls="tools" aria-expanded="false" title="设置与搜索">⚙</button>
<aside id="tools" aria-label="图谱设置与搜索" hidden>
  <label for="search">查找记录</label><input id="search" type="search" placeholder="名称、用途、状态" autocomplete="off">
  <div id="results" aria-label="查找结果" hidden></div>
  <div class="section-label">显示层级</div>
  <nav id="layers" aria-label="显示层级"><button type="button" data-level="0">研究组</button><button type="button" data-level="1">来源</button><button type="button" data-level="2">分块</button><button type="button" data-level="3">记录</button></nav>
  <label class="display-option"><input id="show-names" type="checkbox">显示主要名称</label>
  <label class="display-option" for="node-size">节点大小<input id="node-size" type="range" min="0.5" max="2" step="0.1" value="1"></label>
  <label class="display-option" for="edge-width">连线粗细<input id="edge-width" type="range" min="0.5" max="2" step="0.1" value="1"></label>
</aside>
<aside id="card" aria-label="节点详情" hidden></aside><div id="hover" role="tooltip" hidden></div>
<aside id="legend" aria-label="图例">
  <div class="legend-row"><span><i class="symbol claim">●</i>声明</span><span><i class="symbol run">■</i>执行</span><span><i class="symbol fact">○</i>事实</span><span><i class="symbol output">⬡</i>产物</span><span><i class="symbol observation">●</i>观测</span><span><i class="symbol hub">◇</i>共同前提</span></div>
  <div class="legend-row legend-note"><span>聚合点显示数量</span><span>浅紫实线 · 依赖</span><span>浅蓝虚线 · 来源</span><span>点线 · 历史</span><span>灰线 · 其他 / 混合</span></div>
</aside>
<footer><span id="state" role="status">准备全量索引…</span><div class="counts"><span id="totals">正在读取…</span><span id="view-counts"></span></div></footer>
<script id="archive-data" type="text/plain">@@ARCHIVE_DATA@@</script><script id="archive-raw" type="text/plain">@@ARCHIVE_RAW@@</script><script id="d3-worker-lib" type="text/plain">@@D3@@</script><script id="archive-worker" type="text/plain">@@WORKER@@</script><script id="archive-renderer" type="text/plain">@@RENDERER@@</script><script>@@PIXI@@</script><script>@@EXPLORER@@</script>
</body></html>
