name: check

on:
  push:
  pull_request:

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Program links and evidence rules
        run: python tools/program.py check program.json
      - name: Contributions
        run: python tools/contrib.py
      - name: Mirror integrity
        run: python tools/share.py check .
